<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleeping Barber Simulation</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 32px 16px;
      background: #f3f6f2;
      color: #24352d;
      font: 16px Arial, sans-serif;
    }
    .page {
      max-width: 720px;
      margin: auto;
    }
    .box {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin: 16px 0;
      box-shadow: 0 3px 12px #20332612;
    }
    h1 {
      margin: 0 0 8px;
      color: #236448;
    }
    p {
      line-height: 1.5;
      color: #59675e;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #236448;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #184c36;
    }
    button.light {
      background: #e7efe9;
      color: #236448;
    }
    select {
      padding: 9px;
      border: 1px solid #cbd5cd;
      border-radius: 8px;
    }
    .barber-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
    }
    .barber {
      font-size: 64px;
      text-align: center;
      margin: 0;
    }
    .active-customer {
      font-size: 24px;
      margin-top: -5px;
      height: 30px;
    }
    .status {
      text-align: center;
      font-weight: bold;
      color: #236448;
      margin-top: 5px;
    }
    .chairs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    .chair {
      width: 48px;
      height: 48px;
      border: 2px dashed #a9b8ad;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 22px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 34px;
      font-weight: bold;
    }
    .log {
      font-size: 14px;
      line-height: 1.8;
      color: #526157;
      max-height: 150px;
      overflow: auto;
    }
    .log div {
      border-bottom: 1px solid #edf0ed;
      padding: 3px 0;
    }
    @media(max-width:480px) {
      body {
        padding: 18px 12px;
      }
      .box {
        padding: 18px;
      }
      .stats {
        gap: 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Sleeping Barber Problem</h1>
    <p>This simulation shows how one barber serves customers. Customers wait if a chair is free, and leave if all waiting chairs are occupied.</p>
    
    <section class="box">
      <div class="controls">
        <label for="chairNumber">Waiting chairs:</label>
        <select id="chairNumber">
          <option>3</option>
          <option>5</option>
          <option selected>10</option>
          <option>15</option>
          <option>20</option>
        </select>
        <button id="add">Add Customer</button>
        <button class="light" id="reset">Reset</button>
      </div>
    </section>

    <section class="box">
      <div class="barber-area">
        <div class="barber" id="barber">💤</div>
        <div class="active-customer" id="activeCustomer"></div>
      </div>
      <div class="status" id="status">Barber is sleeping</div>
      <h3 style="text-align:center">Waiting Room</h3>
      <div class="chairs" id="chairs"></div>
      <div class="stats">
        <span>Served: <span id="served">0</span></span>
        <span>Left: <span id="left">0</span></span>
      </div>
    </section>

    <section class="box">
      <h3 style="margin-top:0">Events</h3>
      <div class="log" id="log">Add a customer to start.</div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let queue = [], busy = false, currentCustomer = null, served = 0, left = 0, nextId = 1, timer = null;

    function note(text) {
      const log = $('log');
      if (log.textContent === 'Add a customer to start.') log.innerHTML = '';
      const line = document.createElement('div');
      line.textContent = text;
      log.prepend(line);
    }

    function draw() {
      const count = Number($('chairNumber').value);
      $('chairs').innerHTML = '';
      for (let i = 0; i < count; i++) {
        const seat = document.createElement('div');
        seat.className = 'chair';
        seat.textContent = i < queue.length ? '🧑' : '🪑';
        $('chairs').append(seat);
      }
      $('barber').textContent = busy ? '💈' : '💤';
      $('activeCustomer').textContent = busy ? '🧑' : '';
      $('status').textContent = busy ? `Barber is cutting hair (Customer ${currentCustomer})` : 'Barber is sleeping';
      $('served').textContent = served;
      $('left').textContent = left;
    }

    function serve() {
      if (busy || queue.length === 0) {
        currentCustomer = null;
        draw();
        return;
      }
      currentCustomer = queue.shift();
      busy = true;
      note('Customer ' + currentCustomer + ' moves from waiting room to the barber chair.');
      draw();
      timer = setTimeout(() => {
        served++;
        busy = false;
        note('Customer ' + currentCustomer + ' is finished.');
        currentCustomer = null;
        draw();
        serve();
      }, 10000);
    }

    $('add').onclick = () => {
      const capacity = Number($('chairNumber').value), id = nextId++;
      if (!busy && queue.length === 0) {
        busy = true;
        currentCustomer = id;
        note('Customer ' + id + ' arrives and wakes up the sleeping barber.');
        draw();
        timer = setTimeout(() => {
          served++;
          busy = false;
          note('Customer ' + id + ' is finished.');
          currentCustomer = null;
          draw();
          serve();
        }, 10000);
      } else if (queue.length < capacity) {
        queue.push(id);
        note('Customer ' + id + ' takes a waiting room chair.');
        draw();
      } else {
        left++;
        note('Customer ' + id + ' leaves because all waiting chairs are full.');
        draw();
      }
    };

    $('chairNumber').onchange = draw;

    $('reset').onclick = () => {
      clearTimeout(timer);
      queue = [];
      busy = false;
      currentCustomer = null;
      served = left = 0;
      nextId = 1;
      $('log').textContent = 'Add a customer to start.';
      draw();
    };

    draw();
  </script>
</body>
</html>
